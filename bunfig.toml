[install]
# Use exact versions by default
exact = true
# Supply-chain cooling-off period: never install a version published less than
# 3 days ago, so a hijacked release is usually caught and yanked before it lands.
minimumReleaseAge = 259200
# Security fixes too new for the window, exempted by exact version only. Each
# entry can be removed once its version is older than the window.
minimumReleaseAgeExcludes = []

[test]
# Test configuration
coverage = true
# Redirect ANIMA_DATA_DIR to a temp dir before any test module loads, so a test
# run can never write to the live ~/.anima (it once truncated the agent-host
# session registry and got running sessions reaped).
preload = ["./scripts/test-preload.ts"]

[serve.static]
# Tailwind CSS processing for the gateway's fullstack dev server
plugins = ["bun-plugin-tailwind"]
